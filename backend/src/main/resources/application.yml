server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: tutorug-api
  datasource:
    url: jdbc:h2:mem:tutorug;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:tutorug-development-secret-change-me-please-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    issuer: tutorug
  platform-fee-percent: ${PLATFORM_FEE_PERCENT:10}
  time-zone: ${APP_TIME_ZONE:Africa/Kampala}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,https://lamboe69.github.io}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
